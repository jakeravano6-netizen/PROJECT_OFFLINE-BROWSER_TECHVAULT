<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 225" preserveAspectRatio="xMaxYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D6E6F8"/>
    </linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A9BFF"/>
      <stop offset="1" stop-color="#0B4AA8"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0A1F44" flood-opacity=".45"/>
    </filter>
  </defs>
  <!-- back page -->
  <g transform="rotate(10 470 112)" filter="url(#sh)">
    <rect x="410" y="34" width="120" height="150" rx="8" fill="#BFD6F2"/>
  </g>
  <!-- main page -->
  <g transform="rotate(-6 440 112)" filter="url(#sh)">
    <rect x="378" y="28" width="130" height="164" rx="9" fill="url(#pg)"/>
    <rect x="394" y="48" width="70" height="8" rx="4" fill="#2B7CD3"/>
    <rect x="394" y="68" width="98" height="6" rx="3" fill="#9DB8D9"/>
    <rect x="394" y="82" width="98" height="6" rx="3" fill="#9DB8D9"/>
    <rect x="394" y="96" width="84" height="6" rx="3" fill="#9DB8D9"/>
    <rect x="394" y="110" width="98" height="6" rx="3" fill="#9DB8D9"/>
    <rect x="394" y="124" width="60" height="6" rx="3" fill="#9DB8D9"/>
  </g>
  <!-- W badge -->
  <g filter="url(#sh)">
    <rect x="320" y="92" width="96" height="96" rx="16" fill="url(#bd)"/>
    <path d="M338 118 L350 164 L362 134 L374 164 L386 118" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- pen -->
  <g transform="rotate(35 520 150)" filter="url(#sh)">
    <rect x="505" y="70" width="18" height="90" rx="4" fill="#F5C400"/>
    <polygon points="505,160 523,160 514,182" fill="#F1D9B0"/>
    <polygon points="510,172 518,172 514,182" fill="#333"/>
    <rect x="505" y="70" width="18" height="14" rx="4" fill="#E1435A"/>
  </g>
  <!-- sparkles -->
  <g fill="#fff" opacity=".85">
    <circle cx="330" cy="50" r="3"/><circle cx="560" cy="60" r="2.5"/><circle cx="300" cy="170" r="2"/>
